[package]
name = "rustune"
version = "0.2.2"
edition = "2021"
description = "A terminal music player with online audio search, local playback, and Winamp skin support"
repository = "https://github.com/dzulfikar08/rustune"
homepage = "https://rustune.dzulfikar.com"
license = "MIT"
keywords = ["music", "player", "terminal", "tui", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "process", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
dirs = "6"
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3", "flac", "ogg", "isomp4", "wav", "aiff", "mkv"] }
zip = { version = "8.5.0", features = ["deflate"] }
rodio = { version = "0.22", features = [
    "symphonia-all",
] }
ureq = { version = "3", features = ["json"] }
quick-xml = "0.38"
md-5 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
