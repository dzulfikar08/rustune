name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  size:
    name: release size (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Report binary size and dependency count
        shell: bash
        run: |
          bytes=$(wc -c < target/release/rustune | tr -d ' ')
          deps=$(cargo tree --edges normal --prefix none | sort -u | wc -l | tr -d ' ')
          {
            echo "### ${{ runner.os }} release binary"
            echo "| metric | value |"
            echo "|---|---|"
            echo "| size | $((bytes / 1024)) KiB |"
            echo "| crates (normal deps) | $deps |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: --help
        shell: bash
        run: |
          out=$(target/release/rustune --help)
          echo "$out"
          grep -q USAGE <<<"$out"
      - name: doctor
        shell: bash
        run: |
          tmp=$(mktemp -d)
          HOME="$tmp" XDG_CONFIG_HOME="$tmp/.config" target/release/rustune doctor
      - name: Play a WAV in a pseudo-terminal
        shell: bash
        run: |
          python3 - <<'EOF'
          import math, os, pty, struct, subprocess, sys, tempfile, threading, time, wave
          import fcntl, termios

          tmp = tempfile.mkdtemp()
          wav = os.path.join(tmp, "tone.wav")
          rate = 44100
          with wave.open(wav, "wb") as w:
              w.setnchannels(2)
              w.setsampwidth(2)
              w.setframerate(rate)
              frames = bytearray()
              for i in range(rate * 5):
                  s = int(12000 * math.sin(2 * math.pi * 440 * i / rate))
                  frames += struct.pack("<hh", s, s)
              w.writeframes(bytes(frames))

          home = os.path.join(tmp, "home")
          xdg = os.path.join(home, ".config")
          config = 'onboarding_done = true\nmusic_dir = "%s"\n' % tmp
          for d in (os.path.join(xdg, "rustune"),
                    os.path.join(home, "Library", "Application Support", "rustune")):
              os.makedirs(d, exist_ok=True)
              with open(os.path.join(d, "config.toml"), "w") as f:
                  f.write(config)

          env = dict(os.environ, TERM="xterm-256color", HOME=home, XDG_CONFIG_HOME=xdg)
          master, slave = os.openpty()
          fcntl.ioctl(slave, termios.TIOCSWINSZ, struct.pack("HHHH", 40, 120, 0, 0))
          proc = subprocess.Popen(["target/release/rustune", wav], stdin=slave,
                                  stdout=slave, stderr=slave, env=env, start_new_session=True)
          os.close(slave)

          out = bytearray()
          def drain():
              while True:
                  try:
                      chunk = os.read(master, 65536)
                  except OSError:
                      break
                  if not chunk:
                      break
                  out.extend(chunk)
          reader = threading.Thread(target=drain, daemon=True)
          reader.start()

          time.sleep(4)
          os.write(master, b"q")
          failed = None
          try:
              code = proc.wait(timeout=10)
              if code != 0:
                  failed = "exit status %d" % code
          except subprocess.TimeoutExpired:
              proc.kill()
              proc.wait()
              failed = "timed out waiting for exit after q"
          reader.join(timeout=2)
          if failed is None and b"panicked" in out:
              failed = "panic in output"
          if failed:
              print("smoke test failed:", failed)
              print(bytes(out[-2048:]).decode("utf-8", errors="replace"))
              sys.exit(1)
          print("smoke test passed (%d bytes of output)" % len(out))
          EOF
      - name: MPRIS over a private D-Bus session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y dbus
          dbus-run-session -- python3 - <<'EOF'
          import math, os, pty, struct, subprocess, sys, tempfile, threading, time, wave
          import fcntl, termios

          tmp = tempfile.mkdtemp()
          wav = os.path.join(tmp, "tone.wav")
          rate = 44100
          with wave.open(wav, "wb") as w:
              w.setnchannels(2)
              w.setsampwidth(2)
              w.setframerate(rate)
              w.writeframes(b"\0\0\0\0" * rate * 30)
          home = os.path.join(tmp, "home")
          xdg = os.path.join(home, ".config")
          os.makedirs(os.path.join(xdg, "rustune"))
          with open(os.path.join(xdg, "rustune", "config.toml"), "w") as f:
              f.write('onboarding_done = true\nmusic_dir = "%s"\n' % tmp)
          env = dict(os.environ, TERM="xterm-256color", HOME=home, XDG_CONFIG_HOME=xdg)

          DEST = "org.mpris.MediaPlayer2.rustune"
          PATH = "/org/mpris/MediaPlayer2"
          PLAYER = "org.mpris.MediaPlayer2.Player"
          def send(*args):
              r = subprocess.run(["dbus-send", "--session", "--print-reply", "--reply-timeout=3000",
                                  "--dest=" + DEST, PATH] + list(args),
                                 capture_output=True, text=True, timeout=10)
              print("$ dbus-send", " ".join(args), "\n" + r.stdout + r.stderr)
              return r
          def get(iface, prop):
              return send("org.freedesktop.DBus.Properties.Get", "string:" + iface, "string:" + prop).stdout
          def wait_for(pred, what, timeout=10):
              end = time.time() + timeout
              while time.time() < end:
                  if pred():
                      return
                  time.sleep(0.2)
              fail("timed out waiting for " + what)

          master, slave = os.openpty()
          fcntl.ioctl(slave, termios.TIOCSWINSZ, struct.pack("HHHH", 40, 120, 0, 0))
          proc = subprocess.Popen(["target/release/rustune", wav], stdin=slave,
                                  stdout=slave, stderr=slave, env=env, start_new_session=True)
          os.close(slave)
          out = bytearray()
          def drain():
              while True:
                  try:
                      chunk = os.read(master, 65536)
                  except OSError:
                      break
                  if not chunk:
                      break
                  out.extend(chunk)
          threading.Thread(target=drain, daemon=True).start()
          def fail(msg):
              print("MPRIS test failed:", msg)
              print(bytes(out[-2048:]).decode("utf-8", errors="replace"))
              proc.kill()
              sys.exit(1)

          def owned():
              r = subprocess.run(["dbus-send", "--session", "--print-reply", "--dest=org.freedesktop.DBus",
                                  "/org/freedesktop/DBus", "org.freedesktop.DBus.NameHasOwner",
                                  "string:" + DEST], capture_output=True, text=True, timeout=10)
              return "boolean true" in r.stdout
          wait_for(owned, DEST + " on the bus")

          if 'string "rustune"' not in get("org.mpris.MediaPlayer2", "Identity"):
              fail("Identity")
          wait_for(lambda: '"tone"' in get(PLAYER, "Metadata"), "Metadata with the track title")
          if "mpris:trackid" not in get(PLAYER, "Metadata"):
              fail("Metadata lacks mpris:trackid")
          if "org.mpris.MediaPlayer2.Player" not in send("org.freedesktop.DBus.Introspectable.Introspect").stdout:
              fail("Introspect")
          if "CanControl" not in send("org.freedesktop.DBus.Properties.GetAll", "string:" + PLAYER).stdout:
              fail("GetAll")

          monitor = subprocess.Popen(["dbus-monitor", "--session",
                                      "type='signal',interface='org.freedesktop.DBus.Properties',member='PropertiesChanged'"],
                                     stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          time.sleep(1)
          send("org.freedesktop.DBus.Properties.Set", "string:" + PLAYER, "string:Volume", "variant:double:0.25")
          wait_for(lambda: "double 0.25" in get(PLAYER, "Volume"), "Volume 0.25")
          send("org.freedesktop.DBus.Properties.Set", "string:" + PLAYER, "string:LoopStatus", "variant:string:Playlist")
          wait_for(lambda: '"Playlist"' in get(PLAYER, "LoopStatus"), "LoopStatus Playlist")
          send(PLAYER + ".Stop")
          wait_for(lambda: '"Stopped"' in get(PLAYER, "PlaybackStatus"), "PlaybackStatus Stopped")
          time.sleep(1)
          monitor.terminate()
          signals = monitor.communicate(timeout=5)[0]
          print(signals)
          if "Volume" not in signals or "LoopStatus" not in signals:
              fail("PropertiesChanged signals for Volume/LoopStatus not seen")

          send("org.mpris.MediaPlayer2.Quit")
          try:
              code = proc.wait(timeout=10)
          except subprocess.TimeoutExpired:
              fail("Quit did not exit")
          if code != 0:
              fail("exit status %d" % code)
          if b"panicked" in out:
              fail("panic in output")
          print("MPRIS test passed (TUI)")

          # --daemon serves MPRIS too.
          log = open(os.path.join(tmp, "daemon.log"), "w+")
          proc = subprocess.Popen(["target/release/rustune", "--daemon", wav], stdin=subprocess.DEVNULL,
                                  stdout=log, stderr=log, env=env)
          def fail(msg):
              print("MPRIS daemon test failed:", msg)
              log.flush()
              log.seek(0)
              print(log.read()[-4096:])
              if proc.poll() is None:
                  proc.kill()
              sys.exit(1)
          wait_for(owned, DEST + " from the daemon")
          if 'string "rustune"' not in get("org.mpris.MediaPlayer2", "Identity"):
              fail("daemon Identity")
          wait_for(lambda: '"tone"' in get(PLAYER, "Metadata"), "daemon Metadata with the track title")
          send("org.freedesktop.DBus.Properties.Set", "string:" + PLAYER, "string:Volume", "variant:double:0.5")
          wait_for(lambda: "double 0.5" in get(PLAYER, "Volume"), "daemon Volume 0.5")
          send(PLAYER + ".Stop")
          wait_for(lambda: '"Stopped"' in get(PLAYER, "PlaybackStatus"), "daemon PlaybackStatus Stopped")
          send("org.mpris.MediaPlayer2.Quit")
          try:
              code = proc.wait(timeout=10)
          except subprocess.TimeoutExpired:
              fail("daemon did not exit on Quit")
          if code != 0:
              fail("daemon exit status %d" % code)
          log.seek(0)
          if "panicked" in log.read():
              fail("panic in daemon output")
          print("MPRIS test passed (daemon)")
          EOF
      - name: Daemon + remote control
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, math, os, re, signal, struct, subprocess, sys, tempfile, threading, time, wave

          BIN = os.path.abspath("target/release/rustune")
          tmp = tempfile.mkdtemp()

          def make_wav(name, secs):
              path = os.path.join(tmp, name)
              rate = 44100
              one = [struct.pack("<hh", s, s) for s in
                     (int(12000 * math.sin(2 * math.pi * 440 * i / rate)) for i in range(rate // 10))]
              block = b"".join(one)
              with wave.open(path, "wb") as w:
                  w.setnchannels(2)
                  w.setsampwidth(2)
                  w.setframerate(rate)
                  w.writeframes(block * (secs * 10))
              return path

          wav1 = make_wav("tone.wav", 20)
          wav2 = make_wav("tone2.wav", 20)

          home = os.path.join(tmp, "home")
          xdg = os.path.join(home, ".config")
          config = 'onboarding_done = true\nmusic_dir = "%s"\n' % tmp
          conf_dirs = [os.path.join(xdg, "rustune"),
                       os.path.join(home, "Library", "Application Support", "rustune")]
          for d in conf_dirs:
              os.makedirs(d, exist_ok=True)
              with open(os.path.join(d, "config.toml"), "w") as f:
                  f.write(config)
          # Short runtime dir: macOS temp paths can exceed the socket path limit.
          runtime = tempfile.mkdtemp(dir="/tmp")
          sock = os.path.join(runtime, "rustune.sock")
          env = dict(os.environ, HOME=home, XDG_CONFIG_HOME=xdg, XDG_RUNTIME_DIR=runtime)
          env.pop("RUSTUNE_SOCKET", None)

          log = open(os.path.join(tmp, "daemon.log"), "w+")
          daemon = subprocess.Popen([BIN, "--daemon", wav1], stdin=subprocess.DEVNULL,
                                    stdout=log, stderr=log, env=env)

          def fail(msg):
              print("daemon smoke test failed:", msg)
              log.flush()
              log.seek(0)
              print("--- daemon log ---")
              print(log.read()[-4096:])
              if daemon.poll() is None:
                  daemon.kill()
              sys.exit(1)

          def rt(*args, ok=True, timeout=15):
              p = subprocess.run([BIN, *args], env=env, capture_output=True, text=True,
                                 timeout=timeout, stdin=subprocess.DEVNULL)
              if ok and p.returncode != 0:
                  fail("rustune %s exited %d: %s%s" % (" ".join(args), p.returncode, p.stdout, p.stderr))
              return p

          def status():
              p = rt("status", "--json", ok=False)
              return json.loads(p.stdout) if p.returncode == 0 else None

          def wait_for(pred, what, timeout=15):
              deadline = time.time() + timeout
              st = None
              while time.time() < deadline:
                  if daemon.poll() is not None:
                      fail("daemon exited early with %d" % daemon.returncode)
                  st = status()
                  if st is not None and pred(st):
                      return st
                  time.sleep(0.1)
              fail("timed out waiting for %s (last status: %s)" % (what, st))

          st = wait_for(lambda s: s["queue_length"] == 1 and s["title"] == "tone", "the daemon to queue tone.wav")
          print("initial status:", json.dumps(st))
          if oct(os.stat(sock).st_mode & 0o777) != oct(0o600):
              fail("socket mode is %o, want 600" % (os.stat(sock).st_mode & 0o777))
          human = rt("status").stdout
          if "tone" not in human or "Queue:   1/1" not in human:
              fail("unexpected human status: %r" % human)
          audio = st["status"] == "playing"
          print("audio output:", "yes" if audio else "no (runner has no device)")

          rt("pause")
          st = status()
          if st["status"] != ("paused" if audio else "stopped"):
              fail("after pause: %s" % st)
          rt("toggle")
          st = status()
          if st["status"] != ("playing" if audio else "stopped"):
              fail("after toggle: %s" % st)

          rt("volume", "40")
          if status()["volume"] != 40:
              fail("volume 40 not applied: %s" % status())
          rt("volume", "+5")
          if status()["volume"] != 45:
              fail("volume +5 not applied: %s" % status())
          rt("shuffle")
          if status()["shuffle"] is not True:
              fail("shuffle not toggled")
          rt("shuffle")
          rt("repeat", "one")
          if status()["repeat"] != "one":
              fail("repeat one not applied")
          rt("repeat", "off")
          rt("eq", "rock")
          if status()["eq_enabled"] is not True:
              fail("eq preset did not enable the EQ")
          rt("eq", "off")
          if status()["eq_enabled"] is not False:
              fail("eq off not applied")
          rt("seek", "0:02")

          bad = rt("volume", "200", ok=False)
          if bad.returncode != 2 or "bad volume" not in bad.stderr:
              fail("bad volume accepted: %d %r" % (bad.returncode, bad.stderr))

          # A second `rustune FILE` hands the file to the running daemon.
          handoff = rt(wav2)
          if "queued" not in handoff.stdout:
              fail("no hand-off message: %r" % handoff.stdout)
          wait_for(lambda s: s["queue_length"] == 2, "tone2.wav to be queued")

          rt("next")
          st = status()
          if st["queue_index"] != 1 or st["title"] != "tone2":
              fail("after next: %s" % st)

          # watch: a status line now, another on every change.
          watch = subprocess.Popen([BIN, "watch"], env=env, stdout=subprocess.PIPE, text=True)
          lines = []
          threading.Thread(target=lambda: [lines.append(l) for l in watch.stdout], daemon=True).start()
          deadline = time.time() + 10
          while not lines and time.time() < deadline:
              time.sleep(0.05)
          if not lines:
              fail("watch printed nothing")
          json.loads(lines[0])
          rt("volume", "30")
          deadline = time.time() + 10
          while time.time() < deadline and not any(json.loads(l)["volume"] == 30 for l in list(lines)):
              time.sleep(0.05)
          if not any(json.loads(l)["volume"] == 30 for l in list(lines)):
              fail("watch missed the volume change: %s" % lines)

          # Queue editing.
          items = json.loads(rt("list", "--json").stdout)["items"]
          if [i["title"] for i in items] != ["tone", "tone2"] or not items[1]["current"]:
              fail("unexpected list --json: %s" % items)
          human = rt("list").stdout
          if not re.search(r"^>.\s*2\. tone2\b.*\(local\)$", human, re.M):
              fail("unexpected list: %r" % human)
          rt("jump", "1")
          st = status()
          if st["queue_index"] != 0 or st["title"] != "tone":
              fail("after jump 1: %s" % st)
          rt("move", "2", "1")
          items = json.loads(rt("list", "--json").stdout)["items"]
          if [i["title"] for i in items] != ["tone2", "tone"] or not items[1]["current"]:
              fail("after move 2 1: %s" % items)
          rt("remove", "1")
          if [i["title"] for i in json.loads(rt("list", "--json").stdout)["items"]] != ["tone"]:
              fail("after remove 1: %s" % rt("list").stdout)
          bad = rt("jump", "9", ok=False)
          if bad.returncode != 1 or "no item 9" not in bad.stderr:
              fail("jump 9: %d %r" % (bad.returncode, bad.stderr))
          bad = rt("jump", "0", ok=False)
          if bad.returncode != 2:
              fail("jump 0 accepted: %d %r" % (bad.returncode, bad.stderr))

          # Search the library inside the daemon (it scans on demand).
          found = json.loads(rt("search", "local", "tone", "--json").stdout)
          names = sorted(r["title"] for r in found["results"])
          if names != ["tone", "tone2"] or found["results"][0]["index"] != 1:
              fail("search local: %s" % found)
          human = rt("search", "local", "tone2").stdout
          if "  1. tone2" not in human:
              fail("unexpected search output: %r" % human)
          queued = rt("search", "local", "tone2", "--queue").stdout
          if "Queued 1 track(s)" not in queued or status()["queue_length"] != 2:
              fail("search --queue: %r %s" % (queued, status()))
          played = rt("search", "local", "tone", "--play", "2").stdout
          st = status()
          want = found["results"][1]["title"]
          if "Playing: " + want not in played or st["queue_index"] != 1 or st["title"] != want:
              fail("search --play 2: %r %s" % (played, st))
          nothing = rt("search", "local", "zzz-no-match", "--json")
          if json.loads(nothing.stdout)["results"] != []:
              fail("search for nothing: %r" % nothing.stdout)

          # Status extras, the raw protocol, and what needs the TUI.
          st = status()
          for key in ("source", "view", "theme", "vis", "resolving", "last_error"):
              if key not in st:
                  fail("status lacks %s: %s" % (key, st))
          if st["source"] != "local" or st["resolving"] is not False:
              fail("status extras: %s" % st)
          raw = json.loads(rt("send", '{"get":"queue"}').stdout)
          if len(raw["items"]) != 2:
              fail("send get queue: %s" % raw)
          bad = rt("send", '{"get":"weather"}', ok=False)
          if bad.returncode != 1 or "error" not in bad.stdout:
              fail("send bad request: %d %r" % (bad.returncode, bad.stdout))
          for args in (["key", "j"], ["screen"]):
              bad = rt(*args, ok=False)
              if bad.returncode != 1 or "--daemon" not in bad.stderr:
                  fail("%s against the daemon: %d %r" % (args, bad.returncode, bad.stderr))
          rt("vis", "scope")
          if status()["vis"] != "scope":
              fail("vis scope not applied: %s" % status())
          rt("theme", "light")
          if status()["theme"] != "Light":
              fail("theme light not applied: %s" % status())
          # LRCLIB is online: a slow answer is reported, not hung on.
          lyr = rt("lyrics", ok=False, timeout=45)
          if not (lyr.returncode == 0 and lyr.stdout.startswith(("No lyrics", "Lyrics"))) \
                  and "did not answer" not in lyr.stderr:
              fail("lyrics: %d %r %r" % (lyr.returncode, lyr.stdout, lyr.stderr))

          rt("clear")
          if status()["queue_length"] != 0:
              fail("clear not applied: %s" % status())

          rt("stop")
          if status()["status"] != "stopped":
              fail("stop not applied: %s" % status())

          daemon.send_signal(signal.SIGTERM)
          try:
              code = daemon.wait(timeout=10)
          except subprocess.TimeoutExpired:
              fail("daemon ignored SIGTERM")
          if code != 0:
              fail("daemon exit status %d" % code)
          try:
              watch.wait(timeout=5)
          except subprocess.TimeoutExpired:
              watch.kill()
              fail("watch did not end with the daemon")
          if os.path.exists(sock):
              fail("socket left behind")
          states = [os.path.join(d, "state.toml") for d in conf_dirs]
          saved = [open(p).read() for p in states if os.path.exists(p)]
          m = re.search(r"^volume = ([0-9.]+)", saved[0] if saved else "", re.M)
          if not m or abs(float(m.group(1)) - 0.3) > 0.01:
              fail("session not saved on SIGTERM: %r" % saved)
          gone = rt("status", ok=False)
          if gone.returncode != 1 or "no running instance" not in gone.stderr:
              fail("status without an instance: %d %r" % (gone.returncode, gone.stderr))
          log.seek(0)
          if "panicked" in log.read():
              fail("panic in daemon output")
          print("daemon smoke test passed")
          EOF

      - name: Drive the TUI remotely (key, screen)
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, math, os, struct, subprocess, sys, tempfile, threading, time, wave
          import fcntl, termios

          BIN = os.path.abspath("target/release/rustune")
          tmp = tempfile.mkdtemp()
          wavs = []
          for n in (1, 2, 3):
              path = os.path.join(tmp, "tone%d.wav" % n)
              with wave.open(path, "wb") as w:
                  w.setnchannels(2)
                  w.setsampwidth(2)
                  w.setframerate(44100)
                  w.writeframes(b"\0\0\0\0" * 44100 * 30)
              wavs.append(path)
          home = os.path.join(tmp, "home")
          xdg = os.path.join(home, ".config")
          config = 'onboarding_done = true\nmusic_dir = "%s"\n' % tmp
          for d in (os.path.join(xdg, "rustune"),
                    os.path.join(home, "Library", "Application Support", "rustune")):
              os.makedirs(d, exist_ok=True)
              with open(os.path.join(d, "config.toml"), "w") as f:
                  f.write(config)
          runtime = tempfile.mkdtemp(dir="/tmp")
          env = dict(os.environ, TERM="xterm-256color", HOME=home, XDG_CONFIG_HOME=xdg,
                     XDG_RUNTIME_DIR=runtime)
          env.pop("RUSTUNE_SOCKET", None)

          master, slave = os.openpty()
          fcntl.ioctl(slave, termios.TIOCSWINSZ, struct.pack("HHHH", 40, 120, 0, 0))
          proc = subprocess.Popen([BIN] + wavs, stdin=slave, stdout=slave, stderr=slave,
                                  env=env, start_new_session=True)
          os.close(slave)
          out = bytearray()
          def drain():
              while True:
                  try:
                      chunk = os.read(master, 65536)
                  except OSError:
                      break
                  if not chunk:
                      break
                  out.extend(chunk)
          threading.Thread(target=drain, daemon=True).start()

          def fail(msg):
              print("TUI remote test failed:", msg)
              print(bytes(out[-2048:]).decode("utf-8", errors="replace"))
              if proc.poll() is None:
                  proc.kill()
              sys.exit(1)

          def rt(*args, ok=True):
              p = subprocess.run([BIN, *args], env=env, capture_output=True, text=True,
                                 timeout=15, stdin=subprocess.DEVNULL)
              if ok and p.returncode != 0:
                  fail("rustune %s exited %d: %s%s" % (" ".join(args), p.returncode, p.stdout, p.stderr))
              return p

          def status():
              p = rt("status", "--json", ok=False)
              return json.loads(p.stdout) if p.returncode == 0 else None

          def wait_for(pred, what, timeout=20):
              deadline = time.time() + timeout
              last = None
              while time.time() < deadline:
                  if proc.poll() is not None:
                      fail("rustune exited early with %d" % proc.returncode)
                  try:
                      last = pred()
                  except Exception as e:
                      last = e
                  if last:
                      return last
                  time.sleep(0.2)
              fail("timed out waiting for %s (last: %r)" % (what, last))

          def screen():
              return rt("screen").stdout

          st = wait_for(lambda: (status() or {}).get("queue_length") == 3 and status(), "the TUI to queue 3 WAVs")
          print("status:", json.dumps(st))
          if st["view"] != "browse" or st["source"] != "local":
              fail("unexpected view/source: %s" % st)
          # The library list (scanned from music_dir) with its >> highlight.
          before = wait_for(lambda: (lambda s: "tone3" in s and ">>" in s and s)(screen()), "the library list")
          print(before)
          shot = json.loads(rt("screen", "--json").stdout)
          if (shot["width"], shot["height"]) != (120, 40) or "cursor" not in shot or "ansi" in shot:
              fail("screen --json: %s" % {k: shot[k] for k in shot if k != "text"})
          if "\x1b[" not in rt("screen", "--ansi").stdout:
              fail("screen --ansi has no colours")
          row = lambda s: next((l for l in s.splitlines() if ">>" in l), "")

          rt("key", "j", "j")
          after = screen()
          print(after)
          if row(after) == row(before) or after == before:
              fail("j j did not move the highlight: %r -> %r" % (row(before), row(after)))
          if "tone3" not in row(after):
              fail("highlight is not on the third track: %r" % row(after))

          rt("key", "?")
          palette = screen()
          print(palette)
          if "Commands" not in palette or "Commands" in after:
              fail("the palette did not open")
          if status()["view"] != "palette":
              fail("status view is not palette: %s" % status())
          rt("key", "Esc")
          closed = screen()
          if "Commands" in closed or status()["view"] != "browse":
              fail("Esc did not close the palette")

          rt("key", "/", "--text", "tone2")
          prompt = json.loads(rt("screen", "--json").stdout)
          if "tone2" not in prompt["text"] or status()["view"] != "input" or prompt["cursor"] is None:
              fail("typing into the search prompt: %s" % prompt["cursor"])
          rt("key", "Enter")
          found = screen()
          if "tone2" not in row(found) or status()["view"] != "browse":
              fail("search for tone2 did not select it: %r" % found)

          bad = rt("key", "Enterr", ok=False)
          if bad.returncode != 2 or "bad key" not in bad.stderr:
              fail("bad key accepted: %d %r" % (bad.returncode, bad.stderr))

          rt("quit")
          try:
              code = proc.wait(timeout=10)
          except subprocess.TimeoutExpired:
              fail("quit did not exit")
          if code != 0:
              fail("exit status %d" % code)
          if b"panicked" in out:
              fail("panic in output")
          print("TUI remote test passed")
          EOF

  screenshots:
    name: terminal screenshots (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev fonts-dejavu-core
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyte pillow
      - name: Download the base-2.91 skin
        run: |
          curl -fsSL --retry 3 -o base-2.91.wsz \
            https://r2.webampskins.org/skins/5e4f10275dcb1fb211d4a8b4f1bda236.wsz
      - name: Capture the Winamp and Dark themes in a pseudo-terminal
        run: python .github/scripts/screenshots.py target/release/rustune base-2.91.wsz screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-screenshots
          path: screenshots/*.png
          if-no-files-found: error
